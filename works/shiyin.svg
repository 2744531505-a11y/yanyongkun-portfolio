<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="电商视觉与短视频运营">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <radialGradient id="amber" cx="26%" cy="34%" r="38%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="74%" cy="66%" r="40%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="330" r="380" fill="url(#amber)" filter="url(#blur)"/>
  <circle cx="1180" cy="660" r="390" fill="url(#cyan)" filter="url(#blur)"/>

  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <path d="M0 780L1600 260" stroke="url(#beam)" stroke-width="3"/>

  <g>
    <circle cx="390" cy="380" r="190" fill="rgba(10,12,20,0.5)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
    <ellipse cx="330" cy="310" rx="70" ry="46" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-28 330 310)"/>
    <circle cx="410" cy="360" r="72" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.55)" stroke-width="2"/>
    <circle cx="412" cy="357" r="10" fill="#fbbf24"/>
  </g>

  <g>
    <circle cx="1180" cy="620" r="168" fill="rgba(10,12,20,0.5)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <circle cx="1120" cy="560" r="60" fill="rgba(103,232,249,0.12)" stroke="rgba(103,232,249,0.5)" stroke-width="2"/>
    <rect x="1128" y="680" width="104" height="64" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  </g>

  <g fill="#67e8f9" fill-opacity="0.8">
    <circle cx="140" cy="160" r="5"/>
    <circle cx="1500" cy="160" r="6"/>
    <circle cx="1420" cy="880" r="5"/>
  </g>

  <text x="80" y="920" fill="rgba(255,255,255,0.52)" font-family="Arial, sans-serif" font-size="34" letter-spacing="14">VISUAL × VIDEO</text>
</svg>
